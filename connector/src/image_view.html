<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokemula 图片</title>
  <style>
    :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); }
    body { margin: 0; color: var(--color-text-primary, #292524); background: var(--color-background-primary, #fff); }
    #status { margin: 0; padding: 12px 0; font-size: 14px; color: var(--color-text-secondary, #57534e); }
    #images { display: grid; gap: 20px; }
    figure { margin: 0; }
    img { display: block; width: auto; max-width: 100%; max-height: 640px; margin: 0 auto; object-fit: contain; border-radius: 8px; }
    figcaption { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 14px; }
    button { padding: 8px 14px; border: 1px solid var(--color-border-primary, #d6d3d1); border-radius: 8px; color: inherit; background: var(--color-background-secondary, #fafaf9); font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    .feedback { color: var(--color-text-secondary, #57534e); }
    @media (prefers-color-scheme: dark) { body { color: var(--color-text-primary, #f5f5f4); background: var(--color-background-primary, #1c1917); } #status, .feedback { color: var(--color-text-secondary, #d6d3d1); } button { background: var(--color-background-secondary, #292524); } }
  </style>
</head>
<body>
  <p id="status" role="status">等待本次图片结果…</p>
  <main id="images" aria-label="本次图片"></main>
  <script>
  (() => {
    const status = document.getElementById('status');
    const images = document.getElementById('images');
    const pending = new Map();
    let sequence = 0, generation = 0, hostCapabilities = {}, objectUrls = [];
    const notify = (method, params = {}) => parent.postMessage({jsonrpc: '2.0', method, params}, '*');
    const request = (method, params) => new Promise((resolve, reject) => {
      const id = ++sequence;
      pending.set(id, {resolve, reject});
      parent.postMessage({jsonrpc: '2.0', id, method, params}, '*');
    });
    const reset = (message) => {
      generation++;
      images.replaceChildren();
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
      status.textContent = message;
      return generation;
    };
    const decode = data => Uint8Array.from(atob(data), character => character.charCodeAt(0));
    const extension = mime => ({'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp'})[mime];
    const base64 = blob => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = () => reject(new Error('无法读取原图。'));
      reader.readAsDataURL(blob);
    });
    async function render(result) {
      const current = reset('正在显示本次图片…');
      const blocks = (result.content || []).filter(block => block.type === 'image');
      if (result.isError || !blocks.length) {
        const metadata = result.structuredContent;
        status.textContent = metadata?.message || (result.isError ? '本次图片请求失败。' : '本次请求尚未返回图片。');
        resize();
        return;
      }
      const originals = result._meta?.['tokemula/inlineImages'] || [];
      let displayed = 0;
      for (const [index, block] of blocks.entries()) {
        const original = originals.find(image => image.image_index === index);
        let mime = block.mimeType, data = block.data, blob;
        try {
          if (original) {
            if (!hostCapabilities.serverResources) throw new Error('此客户端尚未提供原图资源读取能力。');
            mime = original.mime_type;
            const chunks = [];
            let length = 0;
            for (let chunk = 0; chunk < original.chunks; chunk++) {
              const resource = await request('resources/read', {uri: `${original.resource_uri}/${chunk}`});
              if (current !== generation) return;
              const bytes = decode(resource.contents[0].blob);
              length += bytes.length;
              chunks.push(bytes);
            }
            if (length !== original.byte_length) throw new Error('本次原图未完整返回。');
            blob = new Blob(chunks, {type: mime});
            data = null;
          } else {
            blob = new Blob([decode(data)], {type: mime});
          }
          if (!extension(mime)) throw new Error('本次图片格式不受支持。');
          if (current !== generation) return;
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          image.alt = `本次图片 ${index + 1}`;
          if (data) image.src = `data:${mime};base64,${data}`;
          else { image.src = URL.createObjectURL(blob); objectUrls.push(image.src); }
          const caption = document.createElement('figcaption');
          const dimensions = document.createElement('span');
          image.onload = () => { dimensions.textContent = `${image.naturalWidth} × ${image.naturalHeight}`; resize(); };
          image.onerror = () => { dimensions.textContent = '本次图片显示失败。'; };
          const save = document.createElement('button');
          save.type = 'button';
          save.textContent = '保存图片';
          save.disabled = !hostCapabilities.downloadFile;
          const feedback = document.createElement('span');
          feedback.className = 'feedback';
          if (save.disabled) feedback.textContent = '此客户端尚未提供保存入口。';
          save.onclick = async () => {
            save.disabled = true;
            feedback.textContent = '请选择保存位置…';
            try {
              const download = await request('ui/download-file', {contents: [{type: 'resource', resource: {
                uri: `file:///tokemula-${index + 1}.${extension(mime)}`, mimeType: mime, blob: data || await base64(blob)
              }}]});
              feedback.textContent = download.isError ? '保存未完成，请再次选择保存位置。' : '已交给客户端保存。';
            } catch (_) { feedback.textContent = '保存未完成，请重试保存。'; }
            save.disabled = false;
            resize();
          };
          caption.append(dimensions, save, feedback);
          figure.append(image, caption);
          images.append(figure);
          displayed++;
        } catch (error) {
          if (current !== generation) return;
          const failure = document.createElement('p');
          failure.textContent = original ? '本次原图暂不可读，内存资源保留 10 分钟；请保留请求引用。' : error.message;
          images.append(failure);
        }
      }
      if (current === generation) status.textContent = displayed ? '' : '本次图片未能显示。';
      resize();
    }
    function resize() { notify('ui/notifications/size-changed', {height: Math.ceil(document.body.getBoundingClientRect().height)}); }
    window.addEventListener('message', event => {
      if (event.source !== parent || event.data?.jsonrpc !== '2.0') return;
      const message = event.data;
      if (message.id !== undefined && !message.method) {
        const callback = pending.get(message.id);
        if (!callback) return;
        pending.delete(message.id);
        if (message.error) callback.reject(new Error(message.error.message || '客户端操作失败。'));
        else callback.resolve(message.result);
      } else if (message.method === 'ui/notifications/tool-result') {
        render(message.params);
      } else if (message.method === 'ui/notifications/tool-input') {
        reset('正在获取本次图片…'); resize();
      } else if (message.method === 'ui/notifications/tool-cancelled') {
        reset('本次请求已停止。'); resize();
      } else if (message.method === 'ui/resource-teardown') {
        reset('');
        parent.postMessage({jsonrpc: '2.0', id: message.id, result: {}}, '*');
      }
    });
    request('ui/initialize', {
      appInfo: {name: 'Tokemula 图片', version: '1'},
      appCapabilities: {availableDisplayModes: ['inline']},
      protocolVersion: '2026-01-26'
    }).then(result => {
      hostCapabilities = result.hostCapabilities || {};
      notify('ui/notifications/initialized'); resize();
    }).catch(() => { reset('图片视图连接失败。'); });
  })();
  </script>
</body>
</html>
