[package]
name = "tokemula-image-connector"
version = "0.1.0-wb1.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Image capability core and stdio MCP for Tokemula"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io", "elicitation", "client"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync", "fs", "time", "process", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart"] }
schemars = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
toml_edit = { version = "=0.25.19", features = ["serde"] }
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde"] }
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
getrandom = "=0.4.3"
zeroize = "1"
axum = { version = "=0.8.9", features = ["json"] }
tar = "=0.4.46"
flate2 = "=1.1.11"
ed25519-dalek = "=2.2.0"
semver = "=1.0.28"
fs2 = "=0.4.3"

[dev-dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["client"] }
axum = { version = "=0.8.9", features = ["multipart"] }
futures-util = "0.3"
